<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Machine - Fora do horário</title>
    <link rel="stylesheet" href="/templates/sample/css/sample-root.css">
    <link rel="stylesheet" href="/templates/sample/css/closed.css">

</head>

<body>
    <div class="container">
        <div class="header">
            <img src="/templates/sample/assets/images/DROGAVET_ASSETS_LANDING/TELA_01/HEADER.png">
        </div>

        <div class="header-foguete">
            <img src="/templates/sample/assets/images/DROGAVET_ASSETS_LANDING/TELA_01/FOGUETE.png" alt="Foguete">
        </div>

        <div class="header-raio">
            <img src="/templates/sample/assets/images/DROGAVET_ASSETS_LANDING/TELA_01/RAIO.png" alt="Raio">
        </div>
        <div class="content">
            <div class="description">
                <p>horário de</p>
                <p>funcionamento</p>
                <p>das {{ open_hour }}h às {{ close_hour }}h.</p>
            </div>
        </div>
        <div class="footer">
            <img src="/templates/sample/assets/images/DROGAVET_ASSETS_LANDING/TELA_01/FOOTER.png" alt="Footer">
        </div>

    </div>
</body>

</html>
