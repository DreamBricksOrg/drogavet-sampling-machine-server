<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Machine - Retire sua Amostra</title>
    <link rel="stylesheet" href="/templates/sample/css/sample-root.css">
    <link rel="stylesheet" href="/templates/sample/css/claim.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <img src="/templates/sample/assets/images/DROGAVET_ASSETS_LANDING/TELA_01/HEADER.png">
        </div>

        <div class="header-foguete">
            <img src="/templates/sample/assets/images/DROGAVET_ASSETS_LANDING/TELA_01/FOGUETE.png" alt="Foguete">
        </div>

        <div class="header-raio">
            <img src="/templates/sample/assets/images/DROGAVET_ASSETS_LANDING/TELA_01/RAIO.png" alt="Raio">
        </div>
        <div class="content">
            <div class="description">
                <img src="/templates/sample/assets/images/DROGAVET_ASSETS_LANDING/TELA_02/RETIRE_TEXTO.png"
                    alt="Description">
            </div>
        </div>
        <div class="footer">
            <img src="/templates/sample/assets/images/DROGAVET_ASSETS_LANDING/TELA_01/FOOTER.png" alt="Footer">
        </div>

    </div>

    <script>
        const POLL_INTERVAL_MS = 2000;
        const POLL_MAX_MS = 90000;


        function goToError() {
            window.location.href = '/templates/sample/html/error.html';
        }

        async function fetchSession(sessionId) {
            const res = await fetch(`/api/sample/session/${sessionId}`);
            if (!res.ok) throw new Error(`session fetch ${res.status}`);
            return res.json();
        }

        // Fluxo atual (totem/Unity): dispara o drop e o Unity cuida do resto
        async function completeSession(sessionId, slug) {
            try {
                await fetch('/api/sample/session/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, slug }),
                });
            } catch (_) { }
        }

        // Fluxo QR estático: agenda o ciclo no servidor e acompanha por polling.
        // Em refresh da página, retoma do status atual sem repetir o POST.
        async function startPickupAndPoll(sessionId, slug, currentStatus) {
            if (currentStatus === 'completed') {
                window.location.href = '/api/sample/thanks';
                return;
            }
            if (currentStatus === 'failed' || currentStatus === 'aborted') {
                goToError();
                return;
            }
            if (currentStatus !== 'processing') {
                const res = await fetch('/api/sample/session/pickup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, slug }),
                });
                if (!res.ok) throw new Error(`pickup ${res.status}`);
            }

            const started = Date.now();
            while (Date.now() - started < POLL_MAX_MS) {
                await new Promise(resolve => setTimeout(resolve, POLL_INTERVAL_MS));
                const session = await fetchSession(sessionId);
                if (session.status === 'completed') {
                    window.location.href = '/api/sample/thanks';
                    return;
                }
                if (session.status === 'failed' || session.status === 'aborted') {
                    goToError();
                    return;
                }
            }
            goToError();
        }

        async function init() {
            const sessionId = localStorage.getItem('session_id');
            const slug = localStorage.getItem('slug');
            if (!sessionId || !slug) return;

            try {
                const session = await fetchSession(sessionId);
                if (session.mode === 'qrcode_static') {
                    await startPickupAndPoll(sessionId, slug, session.status);
                } else {
                    await completeSession(sessionId, slug);
                }
            } catch (_) {
                goToError();
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
